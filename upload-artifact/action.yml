name: "Rimrock hygienic artifact upload"
description: >
  Wrapper around actions/upload-artifact@v4 with Rimrock org defaults — capped
  retention and ignore-missing — so CI artifacts stop filling the org-SHARED
  Actions storage quota (see WiFiMaster#255). NOTE: wrap the calling step in
  `continue-on-error: true` so an upload failure can never mark the check red
  (composite steps can't set continue-on-error themselves).
inputs:
  name:
    description: "Artifact name."
    required: true
  path:
    description: "File/dir path(s) to upload."
    required: true
  retention-days:
    description: "Days to keep. Org policy: keep this low (default 14, vs GitHub's 90)."
    required: false
    default: "14"
  if-no-files-found:
    description: "warn | error | ignore. Default ignore — a missing artifact must not fail CI."
    required: false
    default: "ignore"
  overwrite:
    description: "Overwrite an existing artifact of the same name."
    required: false
    default: "false"
  compression-level:
    description: "zip compression 0-9 (default 6)."
    required: false
    default: "6"
runs:
  using: "composite"
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: ${{ inputs.overwrite }}
        compression-level: ${{ inputs.compression-level }}
